name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/
      - name: Snapshot cross-validation tests (CI-ready, no live DB needed)
        run: python -m pytest tests/test_backtest/ -m "cross_validate_snapshot" -v
